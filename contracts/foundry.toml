[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "london"
optimizer = true
optimizer_runs = 200
via_ir = true
fs_permissions = [{ access = "read", path = "./out" }]

[profile.default.fuzz]
runs = 256

[profile.default.invariant]
runs = 16

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
