<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Bastion — fortify your MUSD, earn the badges. Gamified MUSD savings on Mezo.">
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#15191E" stroke-opacity="0.055" stroke-width="1" />
    </pattern>
    <pattern id="fine" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M16 0H0V16" fill="none" stroke="#15191E" stroke-opacity="0.035" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="#EDEAE3" />
  <rect width="1600" height="900" fill="url(#grid)" />

  <!-- elevation drawing of the keep -->
  <g transform="translate(1190 450)">
    <rect x="-250" y="-290" width="500" height="580" fill="#F4F1EA" stroke="#15191E" stroke-opacity="0.5" stroke-width="2" />
    <rect x="-250" y="-290" width="500" height="580" fill="url(#fine)" />
    <path d="M-250 -180h500M-250 -60h500M-250 60h500M-250 180h500" stroke="#15191E" stroke-opacity="0.12" />
    <path d="M-110 200v-210a110 110 0 0 1 220 0v210" fill="none" stroke="#15191E" stroke-width="12" />
    <path d="M-140 200h280" stroke="#1F5F52" stroke-width="14" stroke-linecap="round" />
    <path d="M-40 200v-70a40 40 0 0 1 80 0v70" fill="none" stroke="#15191E" stroke-width="8" />
    <path d="M-110 40h26M84 40h26" stroke="#1F5F52" stroke-width="8" stroke-linecap="round" />
    <path d="M-250 -290h60M-250 -290v60M250 -290h-60M250 -290v60M-250 290h60M-250 290v-60M250 290h-60M250 290v-60"
      fill="none" stroke="#1F5F52" stroke-width="7" />
    <circle cx="0" cy="-330" r="7" fill="#1F5F52" />
  </g>

  <g transform="translate(110 0)">
    <g transform="translate(0 132)">
      <rect width="58" height="58" fill="#F4F1EA" stroke="#15191E" stroke-opacity="0.4" />
      <path d="M13 41V30a16 16 0 0 1 32 0v11" fill="none" stroke="#15191E" stroke-width="3" />
      <path d="M11 41h36" stroke="#1F5F52" stroke-width="4" />
      <text x="78" y="41" font-family="Instrument Serif, Georgia, serif" font-size="44" fill="#15191E">Bastion</text>
    </g>

    <text x="0" y="300" font-family="Instrument Serif, Georgia, serif" font-size="86" fill="#15191E">Fortify your MUSD.</text>
    <text x="0" y="392" font-family="Instrument Serif, Georgia, serif" font-size="86" font-style="italic" fill="#1F5F52">Earn the badges.</text>

    <text x="0" y="452" font-family="IBM Plex Sans, Arial, sans-serif" font-size="24" fill="#5C6672">Gamified MUSD savings on Mezo — deposit, earn yield every second,</text>
    <text x="0" y="490" font-family="IBM Plex Sans, Arial, sans-serif" font-size="24" fill="#5C6672">and unlock six on-chain achievement milestones.</text>

    <g transform="translate(0 534)">
      <rect width="212" height="44" fill="#F4F1EA" stroke="#15191E" stroke-opacity="0.35" />
      <text x="106" y="28" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="15" letter-spacing="1.6" fill="#1F5F52">MEZO TESTNET 31611</text>

      <rect x="228" width="168" height="44" fill="#F4F1EA" stroke="#15191E" stroke-opacity="0.35" />
      <text x="312" y="28" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="15" letter-spacing="1.6" fill="#1F5F52">SETTLED IN MUSD</text>

      <rect x="412" width="196" height="44" fill="#F4F1EA" stroke="#15191E" stroke-opacity="0.35" />
      <text x="510" y="28" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="15" letter-spacing="1.6" fill="#1F5F52">ERC-721 BADGES</text>
    </g>

    <text x="0" y="650" font-family="IBM Plex Mono, monospace" font-size="18" fill="#5C6672">bastion-two-hazel.vercel.app</text>
    <text x="0" y="684" font-family="IBM Plex Mono, monospace" font-size="17" fill="#8B93A0">0xcdf6add60726fb123c26e668e6d4eef06c2c167b</text>
    <text x="0" y="718" font-family="IBM Plex Mono, monospace" font-size="17" fill="#8B93A0">github.com/Ryjen1/Bastion</text>
  </g>
